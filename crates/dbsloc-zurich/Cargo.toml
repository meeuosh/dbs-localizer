[package]
name = "dbsloc-zurich"
version.workspace = true
publish = false
edition = "2021"
description = "Isolated Zurich hospital-folder triage and reviewed import adapter"
license = "GPL-3.0-only"

[dependencies]
dbsloc-pipeline = { path = "../dbsloc-pipeline", default-features = false }
dicom-object = "0.7"
dicom-dictionary-std = "0.7"
dicom-pixeldata = { version = "0.7", default-features = false, features = ["native"] }
rayon = "1.10"
thiserror = "1"
serde_json = "1"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
dicom-core = "0.7"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
